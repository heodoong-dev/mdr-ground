<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[MDR] 맛드레 그라운드</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="[MDR] 맛드레 그라운드">
    <meta property="og:description" content="⚽ 매치 참석 투표, 황금 밸런스 팀 매칭, 월별 출석왕 및 회비 납부 관리!">
    <meta property="og:image" content="https://raw.githubusercontent.com/heodoong-dev/mdr-ground/main/%E1%84%86%E1%85%A1%E1%86%BA%E1%84%83%E1%85%B3%E1%84%85%E1%85%A6FC_%E1%84%85%E1%85%A9%E1%84%80%E1%85%A9.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.360.0/lucide.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.360.0/lucide.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            height: 100dvh; 
            overflow: hidden; 
            overscroll-behavior: none;
        }
        #root { height: 100dvh; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .status-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .break-keep { word-break: keep-all; }
        
        /* 🐖 캐릭터 애니메이션 */
        @keyframes dribble-run {
            0% { transform: translateX(-150px) scaleX(1); }
            45% { transform: translateX(150px) scaleX(1); }
            50% { transform: translateX(150px) scaleX(-1); }
            95% { transform: translateX(-150px) scaleX(-1); }
            100% { transform: translateX(-150px) scaleX(1); }
        }
        @keyframes ball-kick {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(25px) translateY(-20px) rotate(45deg); }
            50% { transform: translateX(50px) translateY(0) rotate(90deg); }
        }
        @keyframes piggy-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes shadow-scale {
            0%, 100% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(0.6); opacity: 0.05; }
        }
        
        .animate-dribble-area { animation: dribble-run 4.5s infinite linear; }
        .animate-piggy-run { animation: piggy-bounce 0.45s infinite ease-in-out; }
        .animate-ball-kick { animation: ball-kick 0.9s infinite ease-out; }
        .animate-piggy-shadow { animation: shadow-scale 0.45s infinite ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        
        const Icon = ({ name, className }) => {
            const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
            return (
                <i 
                    className={`lucide-${kebabName} ${className || ''}`} 
                    style={{ display: 'inline-block', width: '1em', height: '1em', verticalAlign: 'middle' }}
                ></i>
            );
        };

        function App() {
            const [members, setMembers] = useState([]); 
            const [matchedTeams, setMatchedTeams] = useState(null);
            const [teamCount, setTeamCount] = useState(2);
            
            // 탭 상태: 모바일/PC 공용 탭 ('vote' | 'match' | 'rank' | 'fee' | 'manage')
            const [activeTab, setActiveTab] = useState('vote'); 
            const [mainTab, setMainTab] = useState('match'); 
            const [isAdmin, setIsAdmin] = useState(false); 
            const isAdminRef = useRef(false);
            const [isMatching, setIsMatching] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [newMember, setNewMember] = useState({ name: '', gender: '남', level: 3 });
            
            const [filterMode, setFilterMode] = useState('all');
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [showGuestModal, setShowGuestModal] = useState(false);
            const [showDeleteModal, setShowDeleteModal] = useState(null); 
            const [showConfirmModal, setShowConfirmModal] = useState(null); 
            const [showResetModal, setShowResetModal] = useState(false); 
            const [showRecordModal, setShowRecordModal] = useState(false);
            const [showModeModal, setShowModeModal] = useState(false);
            const [showFeeConfigModal, setShowFeeConfigModal] = useState(false);
            const [selectedFeeMember, setSelectedFeeMember] = useState(null); // 최근 6개월 회비 상세 모달용 멤버명
            const [feeInputMonthly, setFeeInputMonthly] = useState(20000);
            const [feeInputSingle, setFeeInputSingle] = useState(10000);
            const [modeInputNote, setModeInputNote] = useState('');
            const [pendingAdminAction, setPendingAdminAction] = useState(null);

            // 매치 성격 모드 (기본: 정기 매치)
            const [currentMatchMode, setCurrentMatchMode] = useState('regular'); // 'regular' | 'irregular'
            const [irregularTitle, setIrregularTitle] = useState('');

            const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState(false);
            const [guestInput, setGuestInput] = useState({ name: '', gender: '남', level: 3 });
            const [showToast, setShowToast] = useState(null); 

            // --- 출석 히스토리 & 회비 상태 관리 ---
            const [attendanceHistory, setAttendanceHistory] = useState(() => {
                try {
                    const saved = localStorage.getItem('mdr_attendance_history');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            // 💡 한국 표준시(KST) 기준 현재 YYYY-MM 추출 (새벽 0시 정각 칼같이 변경)
            const getKSTYearMonth = () => {
                const now = new Date();
                const kstOffset = 9 * 60; // UTC+9
                const kstDate = new Date(now.getTime() + (now.getTimezoneOffset() + kstOffset) * 60000);
                const year = kstDate.getFullYear();
                const month = String(kstDate.getMonth() + 1).padStart(2, '0');
                return `${year}-${month}`;
            };

            const currentYearMonth = getKSTYearMonth();
            const [selectedMonth, setSelectedMonth] = useState(currentYearMonth);
            // 디폴트는 최근 3개월 ('3months')
            // 'month' | '3months' | '6months' | 'custom'
            const [rankPeriod, setRankPeriod] = useState('3months'); 
            
            // 기간조회용 시작월 / 종료월 상태 (기본 3개월 전 ~ 이번 달)
            const getPastYearMonth = (monthsAgo) => {
                const d = new Date();
                d.setMonth(d.getMonth() - monthsAgo);
                return d.toISOString().slice(0, 7);
            };
            const [customStartMonth, setCustomStartMonth] = useState(() => getPastYearMonth(2));
            const [customEndMonth, setCustomEndMonth] = useState(currentYearMonth);

            // 💡 매치 히스토리 접기/펼치기 & 비정기 제외 필터 상태
            const [isHistoryExpanded, setIsHistoryExpanded] = useState(false);
            const [excludeIrregular, setExcludeIrregular] = useState(false);
            
            // 회비 관리 (4가지 상태: paid=완료, single=일회비, break=부상, unpaid=미납)
            // { status: 'paid'|'single'|'break'|'unpaid', reservedDiscount: boolean, singlePaid: boolean }
            const [feeRecords, setFeeRecords] = useState(() => {
                try {
                    const saved = localStorage.getItem('mdr_fee_records');
                    if (saved) {
                        return JSON.parse(saved);
                    }
                } catch (e) {}
                return {};
            });
            // 기본 정규 회비 20,000원, 일회비 10,000원, 구장예약 차감 5,000원
            const [monthlyFeeAmount, setMonthlyFeeAmount] = useState(20000);
            const [singleFeeAmount, setSingleFeeAmount] = useState(10000);
            const RESERVED_DISCOUNT_AMOUNT = 5000;

            // 출석 수동 기록 폼 (matchType: '정기' | '비정기')
            const [recordForm, setRecordForm] = useState({
                date: new Date().toISOString().slice(0, 10),
                matchType: '정기',
                eventNote: '',
                selectedAttendees: []
            });

            // 사용자 배포 구글 웹앱 URL
            const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyV1V28AE1ekzuV2gAWDzK8jvDK7g4Hw86rkHuL3hKojq-yrGHd2R-XFffDD9VdLdk/exec";

            useEffect(() => {
                localStorage.setItem('mdr_attendance_history', JSON.stringify(attendanceHistory));
            }, [attendanceHistory]);

            useEffect(() => {
                localStorage.setItem('mdr_fee_records', JSON.stringify(feeRecords));
            }, [feeRecords]);
            const anyModalOpen = !!(showAdminModal || showGuestModal || showDeleteModal || showConfirmModal || showResetModal || showRecordModal || showModeModal || showFeeConfigModal || selectedFeeMember);
            const anyModalOpenRef = useRef(anyModalOpen);
            anyModalOpenRef.current = anyModalOpen;
            const pushedStateRef = useRef(false);

            useEffect(() => {
                if (anyModalOpen) {
                    if (!pushedStateRef.current) {
                        try {
                            window.history.pushState({ modalOpen: true }, "");
                            pushedStateRef.current = true;
                        } catch (e) {}
                    }
                } else {
                    if (pushedStateRef.current) {
                        pushedStateRef.current = false;
                        if (window.history.state && window.history.state.modalOpen) {
                            try {
                                window.history.back();
                            } catch (e) {}
                        }
                    }
                }
            }, [anyModalOpen]);

            useEffect(() => {
                const handlePopState = () => {
                    if (anyModalOpenRef.current) {
                        setShowAdminModal(false);
                        setShowGuestModal(false);
                        setShowDeleteModal(null);
                        setShowConfirmModal(null);
                        setShowResetModal(false);
                        setShowRecordModal(false);
                        setShowModeModal(false);
                        setShowFeeConfigModal(false);
                        setSelectedFeeMember(null);
                        pushedStateRef.current = false;
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const fetchMembers = () => {
                if (!SHEET_API_URL) {
                    setMembers([]);
                    setIsLoading(false);
                    return;
                }
                fetch(SHEET_API_URL)
                    .then(async (res) => {
                        const text = await res.text();
                        try { return JSON.parse(text); } 
                        catch (e) { throw new Error("Invalid JSON"); }
                    })
                    .then(data => {
                        let memberArray = [];
                        // 1. 단일 멤버 배열 응답이거나 { members: [...], history: [...], fees: {...} } 응답 수용
                        if (Array.isArray(data)) {
                            memberArray = data;
                        } else if (data && Array.isArray(data.members)) {
                            memberArray = data.members;
                            if (Array.isArray(data.history) && data.history.length > 0) {
                                setAttendanceHistory(data.history);
                            }
                            // 💡 구글 시트 '회비' 탭 데이터 실시간 반영 (월별 딥 병합)
                            if (data.fees && typeof data.fees === 'object') {
                                setFeeRecords(prev => {
                                    const merged = { ...prev };
                                    Object.keys(data.fees).forEach(m => {
                                        merged[m] = {
                                            ...(merged[m] || {}),
                                            ...data.fees[m]
                                        };
                                    });
                                    return merged;
                                });
                            }
                        }

                        const validMembers = memberArray.filter(m => m && m.name && String(m.name).trim() !== '');
                        if (validMembers.length === 0) {
                            setMembers([]);
                            setIsLoading(false);
                            return;
                        }
                        const formattedData = validMembers.map(m => {
                            let levelValue = 3;
                            if (typeof m.level === 'string') levelValue = parseInt(m.level.replace(/[^0-9]/g, '')) || 3;
                            else if (typeof m.level === 'number') levelValue = m.level;
                            let genderValue = m.gender === 'M' ? '남' : m.gender === 'F' ? '여' : m.gender;
                            
                            let attendanceStatus = null;
                            const raw = String(m.isAttending || "").trim().toUpperCase();
                            if (m.isAttending === true || raw === "TRUE") attendanceStatus = true;
                            else if (m.isAttending === false || raw === "FALSE") attendanceStatus = false;
                            else if (raw === "HOLD" || raw === "보류") attendanceStatus = "hold";

                            return { ...m, gender: genderValue, level: levelValue, isAttending: attendanceStatus };
                        });
                        setMembers(formattedData);
                        setIsLoading(false); 
                    })
                    .catch(() => {
                        setMembers([]);
                        notify("네트워크 연결 또는 시트 데이터를 확인해주세요.");
                        setIsLoading(false);
                    });
            };

            useEffect(() => { fetchMembers(); }, []);

            const notify = (msg) => {
                setShowToast(msg);
                setTimeout(() => setShowToast(null), 2500);
            };

            // 통합 탭 전환 핸들러 (모바일 및 PC 상단 탭 모두 지원)
            const handleTabSwitch = (tabKey) => {
                if (tabKey === 'manage' && !isAdmin && !isAdminRef.current) {
                    setPendingAdminAction(() => () => {
                        setActiveTab('manage');
                        setMainTab('manage');
                    });
                    setShowAdminModal(true);
                    return;
                }
                if (tabKey === 'vote') {
                    setActiveTab('vote');
                } else {
                    setActiveTab(tabKey);
                    setMainTab(tabKey);
                }
            };

            const handleAdminLogin = () => {
                if (passwordInput.trim() === "0703") {
                    isAdminRef.current = true;
                    setIsAdmin(true);
                    setShowAdminModal(false);
                    setPasswordInput('');
                    setPasswordError(false);
                    
                    const actionToRun = pendingAdminAction;
                    setPendingAdminAction(null);

                    if (actionToRun) {
                        actionToRun();
                    }
                    notify("관리자 인증 완료! 환영합니다.");
                } else {
                    setPasswordError(false);
                    setPasswordError(true);
                }
            };

            const handleLogout = () => {
                isAdminRef.current = false;
                setIsAdmin(false);
                notify("관리자 모드가 해제되었습니다.");
            };

            const requestAttendanceChange = (id, name, status) => {
                const target = members.find(m => m.id === id);
                if (!target || target.isAttending === status) return;
                setShowConfirmModal({ id, name, nextStatus: status });
            };

            const executeAttendanceChange = () => {
                if (!showConfirmModal) return;
                const { id, name, nextStatus } = showConfirmModal;
                setMembers(members.map(m => m.id === id ? { ...m, isAttending: nextStatus } : m));
                setMatchedTeams(null);
                
                if (SHEET_API_URL) {
                    const apiStatus = nextStatus === "hold" ? "HOLD" : nextStatus;
                    fetch(SHEET_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ action: 'toggle', name: name, status: apiStatus })
                    }).catch(() => {});
                }
                setShowConfirmModal(null);
                notify(`${name}님의 상태가 변경되었습니다.`);
            };

            // ID 자동 생성 규격: mdr_YYYYMMDD_r(정기) 또는 mdr_YYYYMMDD_i(비정기)
            const generateMatchId = (dateStr, matchType) => {
                const cleanDate = dateStr.replace(/[^0-9]/g, ''); // 20261004
                const typeCode = matchType === '정기' ? 'r' : 'i';
                return `mdr_${cleanDate}_${typeCode}`;
            };

            // 타이틀 포맷 규격: 'YYYY-MM-DD 정기 매치' 또는 'YYYY-MM-DD 비정기 매치 (사유/이벤트명)'
            const generateMatchTitle = (dateStr, matchType, eventNote = '') => {
                const trimmedNote = (eventNote || '').trim();
                if (matchType === '정기') {
                    return `${dateStr} 정기 매치`;
                }
                return trimmedNote ? `${dateStr} 비정기 매치 (${trimmedNote})` : `${dateStr} 비정기 매치`;
            };

            // 구글 시트에 매치 히스토리 저장 호출 헬퍼
            const sendMatchToSheet = (entry) => {
                if (!SHEET_API_URL) return;
                const payload = JSON.stringify({
                    action: 'addMatch',
                    id: entry.id,
                    date: entry.date,
                    matchType: entry.matchType,
                    eventNote: entry.eventNote || '',
                    title: entry.title,
                    attendees: entry.attendees
                });

                // Google Apps Script는 text/plain 페이로드로 보낼 때 CORS 오류 없이 가장 완벽히 작동합니다.
                fetch(SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: payload
                }).then(() => {
                    console.log("매치 데이터 시트 전송 완료:", entry.title);
                }).catch((err) => {
                    console.error("전송 에러:", err);
                    notify("구글 시트 저장 통신 중 오류가 발생했습니다.");
                });
            };

            // 구글 시트에서 매치 히스토리 삭제 호출 헬퍼
            const deleteMatchFromSheet = (matchId) => {
                if (!SHEET_API_URL) return;
                fetch(SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        action: 'deleteMatch',
                        id: matchId
                    })
                }).catch(() => {});
            };

            // 비정기 모드일 때 참석자 즉시 시트 저장
            const handleSaveCurrentIrregular = () => {
                const attendingRegularMembers = members
                    .filter(m => !m.isGuest && m.isAttending === true)
                    .map(m => m.name);

                if (attendingRegularMembers.length === 0) {
                    notify("현재 참석 투표한 정기멤버가 없습니다.");
                    return;
                }

                const todayStr = new Date().toISOString().slice(0, 10);
                const customId = generateMatchId(todayStr, '비정기');
                const customTitle = generateMatchTitle(todayStr, '비정기', irregularTitle);

                const newEntry = {
                    id: customId,
                    date: todayStr,
                    matchType: '비정기',
                    eventNote: irregularTitle.trim(),
                    title: customTitle,
                    attendees: attendingRegularMembers
                };

                setAttendanceHistory(prev => [newEntry, ...prev.filter(h => h.id !== customId)]);
                sendMatchToSheet(newEntry);
                notify(`[${customTitle}] 출석 기록이 '출석관리' 시트에 저장되었습니다! ⚡`);
            };

            // 투표 리셋 시: 기존 참석자 명단이 있다면 최종 참석 명단으로 덮어쓰기(업데이트) 저장 후 리셋
            const executeReset = () => {
                const attendingRegularMembers = members
                    .filter(m => !m.isGuest && m.isAttending === true)
                    .map(m => m.name);

                let autoSaved = false;
                // 참석자가 1명 이상 있는 경우 최종 참석 명단으로 무조건 덮어쓰기 갱신 보장
                if (attendingRegularMembers.length > 0) {
                    const todayStr = new Date().toISOString().slice(0, 10);
                    const autoId = generateMatchId(todayStr, '정기');
                    const autoTitle = generateMatchTitle(todayStr, '정기');
                    
                    const newRecord = {
                        id: autoId,
                        date: todayStr,
                        matchType: '정기',
                        eventNote: '',
                        title: autoTitle,
                        attendees: attendingRegularMembers
                    };

                    // 기존에 기록이 있더라도 최신 최종 명단으로 완벽히 덮어쓰기 (Upsert)
                    setAttendanceHistory(prev => [newRecord, ...prev.filter(h => h.id !== autoId)]);
                    sendMatchToSheet(newRecord);
                    autoSaved = true;
                }

                // 투표 상태 초기화
                setMembers(members.map(m => ({ ...m, isAttending: null })));
                setMatchedTeams(null);
                if (SHEET_API_URL) {
                    fetch(SHEET_API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'bulkToggle', status: null }) }).catch(() => {});
                }
                setShowResetModal(false);

                if (autoSaved) {
                    notify(`최종 출석 ${attendingRegularMembers.length}명이 최신 상태로 시트에 업데이트 저장된 후 투표가 리셋되었습니다! 👏`);
                } else {
                    notify("모든 투표 기록이 초기화되었습니다.");
                }
            };

            // 기간 필터에 따른 히스토리 목록 추출
            const filteredHistory = useMemo(() => {
                const now = new Date();
                return attendanceHistory.filter(item => {
                    // 비정기 제외 옵션 활성화 시 정기 매치만 허용
                    if (excludeIrregular && item.matchType === '비정기') {
                        return false;
                    }

                    const itemMonth = item.date.slice(0, 7);
                    if (rankPeriod === 'month') {
                        return itemMonth === selectedMonth;
                    }
                    if (rankPeriod === '3months') {
                        const itemDate = new Date(item.date);
                        const diffMonths = (now.getFullYear() - itemDate.getFullYear()) * 12 + (now.getMonth() - itemDate.getMonth());
                        return diffMonths >= 0 && diffMonths < 3;
                    }
                    if (rankPeriod === '6months') {
                        const itemDate = new Date(item.date);
                        const diffMonths = (now.getFullYear() - itemDate.getFullYear()) * 12 + (now.getMonth() - itemDate.getMonth());
                        return diffMonths >= 0 && diffMonths < 6;
                    }
                    if (rankPeriod === 'custom') {
                        const start = customStartMonth <= customEndMonth ? customStartMonth : customEndMonth;
                        const end = customStartMonth <= customEndMonth ? customEndMonth : customStartMonth;
                        return itemMonth >= start && itemMonth <= end;
                    }
                    return true;
                }).sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [attendanceHistory, rankPeriod, selectedMonth, customStartMonth, customEndMonth, excludeIrregular]);

            // 출석왕 집계 계산 (오직 정기멤버 DB에 등록된 멤버만 엄격하게 집계 및 구성)
            const attendanceStats = useMemo(() => {
                const regularMembers = members.filter(m => !m.isGuest);
                const regularMap = new Map();
                
                regularMembers.forEach(m => {
                    regularMap.set(m.name, {
                        id: m.id,
                        name: m.name,
                        gender: m.gender,
                        level: m.level,
                        count: 0
                    });
                });

                const totalMatches = filteredHistory.length;

                filteredHistory.forEach(h => {
                    const validAttendees = new Set(
                        (h.attendees || []).filter(name => regularMap.has(name))
                    );
                    validAttendees.forEach(name => {
                        const target = regularMap.get(name);
                        if (target) target.count += 1;
                    });
                });

                const list = Array.from(regularMap.values()).map(item => ({
                    ...item,
                    rate: totalMatches > 0 ? Math.round((item.count / totalMatches) * 100) : 0
                }));

                // 1차: 출석 횟수 내림차순, 2차: 이름 가나다순
                list.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ko-KR'));

                // 동순위(표준 랭킹: 1위가 2명이면 다음 순위는 3위) 부여
                let currentRank = 1;
                for (let i = 0; i < list.length; i++) {
                    if (i > 0 && list[i].count === list[i - 1].count) {
                        list[i].rank = list[i - 1].rank;
                    } else {
                        list[i].rank = currentRank;
                    }
                    currentRank++;
                }

                // 💡 포디엄을 위한 출석 횟수 티어(Tier)별 그룹핑 (1위가 복수여도 다음 순위가 2위 단상에 정상 표시됨)
                const uniqueCounts = [...new Set(list.filter(item => item.count > 0).map(item => item.count))].sort((a, b) => b - a);
                const podiumTier1 = uniqueCounts[0] !== undefined ? list.filter(item => item.count === uniqueCounts[0]) : [];
                const podiumTier2 = uniqueCounts[1] !== undefined ? list.filter(item => item.count === uniqueCounts[1]) : [];
                const podiumTier3 = uniqueCounts[2] !== undefined ? list.filter(item => item.count === uniqueCounts[2]) : [];

                const rankGroups = { 1: podiumTier1, 2: podiumTier2, 3: podiumTier3 };

                return { list, totalMatches, rankGroups };
            }, [filteredHistory, members]);

            // 비정기 기록 모달 오픈 헬퍼
            const openIrregularRecordModal = (attendeeNames) => {
                setRecordForm({
                    date: new Date().toISOString().slice(0, 10),
                    matchType: '비정기',
                    eventNote: '',
                    selectedAttendees: attendeeNames
                });
                setShowRecordModal(true);
            };

            // 비정기 기록 버튼 클릭 시 (관리자 인증 검증 후 실행)
            const handleIrregularRecordClick = () => {
                const attendingNames = members
                    .filter(m => !m.isGuest && m.isAttending === true)
                    .map(m => m.name);

                if (attendingNames.length === 0) {
                    notify("현재 참석 투표한 정기멤버가 없습니다.");
                    return;
                }

                if (!isAdmin) {
                    setPendingAdminAction(() => () => openIrregularRecordModal(attendingNames));
                    setShowAdminModal(true);
                } else {
                    openIrregularRecordModal(attendingNames);
                }
            };

            // 출석 히스토리 삭제
            const handleDeleteHistory = (histId) => {
                setAttendanceHistory(prev => prev.filter(h => h.id !== histId));
                deleteMatchFromSheet(histId);
                notify("해당 매치 기록이 삭제되었습니다.");
            };

            const currentFeeStatus = feeRecords[selectedMonth] || {};
            // 정기멤버 목록을 가나다순으로 통일하여 투표/출석왕/회비 간 완벽 동기화
            const regularMemberList = useMemo(() => {
                return members
                    .filter(m => !m.isGuest)
                    .sort((a, b) => a.name.localeCompare(b.name, 'ko-KR'));
            }, [members]);
            
            // 💡 구글 시트 '회비' 탭으로 실시간 전송 헬퍼 함수
            const sendFeeToSheet = (month, name, status, reservedDiscount, singlePaid) => {
                if (!SHEET_API_URL) return;
                fetch(SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        action: 'updateFee',
                        month: month,
                        name: name,
                        status: status,
                        reservedDiscount: reservedDiscount,
                        singlePaid: singlePaid
                    })
                }).catch(() => {});
            };

            // 멤버별 회비 상태 변경 (관리자 전용)
            const setMemberFeeStatus = (memberName, status) => {
                if (!isAdmin && !isAdminRef.current) {
                    setPendingAdminAction(() => () => setMemberFeeStatus(memberName, status));
                    setShowAdminModal(true);
                    return;
                }

                const currentObj = currentFeeStatus[memberName] || { status: 'unpaid', reservedDiscount: false, singlePaid: false };
                const currentEntry = typeof currentObj === 'string' ? { status: currentObj, reservedDiscount: false, singlePaid: false } : currentObj;
                const nextDiscount = currentEntry.reservedDiscount;
                // 일회비로 변경 시 기본 미입금(false), 완료로 가면 무관
                const nextSinglePaid = status === 'single' ? (currentEntry.singlePaid || false) : false;

                setFeeRecords(prev => ({
                    ...prev,
                    [selectedMonth]: {
                        ...(prev[selectedMonth] || {}),
                        [memberName]: {
                            status: status,
                            reservedDiscount: nextDiscount,
                            singlePaid: nextSinglePaid
                        }
                    }
                }));

                // 구글 시트 '회비' 시트로 즉시 전송
                sendFeeToSheet(selectedMonth, memberName, status, nextDiscount, nextSinglePaid);
            };

            // 구장 예약 할인 토글 (관리자 전용)
            const toggleReservedDiscount = (memberName) => {
                if (!isAdmin && !isAdminRef.current) {
                    setPendingAdminAction(() => () => toggleReservedDiscount(memberName));
                    setShowAdminModal(true);
                    return;
                }

                const currentObj = currentFeeStatus[memberName] || { status: 'unpaid', reservedDiscount: false, singlePaid: false };
                const currentEntry = typeof currentObj === 'string' ? { status: currentObj, reservedDiscount: false, singlePaid: false } : currentObj;
                const nextDiscount = !currentEntry.reservedDiscount;

                setFeeRecords(prev => ({
                    ...prev,
                    [selectedMonth]: {
                        ...(prev[selectedMonth] || {}),
                        [memberName]: {
                            ...currentEntry,
                            reservedDiscount: nextDiscount
                        }
                    }
                }));

                // 구글 시트 '회비' 시트로 즉시 전송
                sendFeeToSheet(selectedMonth, memberName, currentEntry.status, nextDiscount, currentEntry.singlePaid || false);
            };

            // 💡 일회비 멤버의 입금 완료 여부 토글 (관리자 전용)
            const toggleSinglePaidStatus = (memberName) => {
                if (!isAdmin && !isAdminRef.current) {
                    setPendingAdminAction(() => () => toggleSinglePaidStatus(memberName));
                    setShowAdminModal(true);
                    return;
                }

                const currentObj = currentFeeStatus[memberName] || { status: 'single', reservedDiscount: false, singlePaid: false };
                const currentEntry = typeof currentObj === 'string' ? { status: currentObj, reservedDiscount: false, singlePaid: false } : currentObj;
                const nextSinglePaid = !currentEntry.singlePaid;

                setFeeRecords(prev => ({
                    ...prev,
                    [selectedMonth]: {
                        ...(prev[selectedMonth] || {}),
                        [memberName]: {
                            ...currentEntry,
                            singlePaid: nextSinglePaid
                        }
                    }
                }));

                sendFeeToSheet(selectedMonth, memberName, currentEntry.status, currentEntry.reservedDiscount, nextSinglePaid);
                notify(`${memberName}님의 일회비가 ${nextSinglePaid ? '입금 확인(완납)' : '미입금'}으로 변경되었습니다.`);
            };

            const feeSummary = useMemo(() => {
                let paidCount = 0;
                let reservedDiscountCount = 0;
                let singleCount = 0;
                let singlePaidCount = 0; // 실제 일회비 입금 완료한 인원
                let singleTotalAttendances = 0;
                let breakCount = 0;
                let unpaidCount = 0;
                let collectedAmount = 0;

                // 💡 선택된 월(selectedMonth)의 출석 횟수 매핑: 오직 '정기' 매치만 집계 (비정기 번개/교류전 제외)
                const monthHistory = (attendanceHistory || []).filter(h => 
                    h.date && 
                    h.date.startsWith(selectedMonth) &&
                    (h.matchType === '정기' || !h.matchType || h.matchType === '')
                );
                const monthAttendanceCounts = {};
                monthHistory.forEach(h => {
                    const attendees = Array.isArray(h.attendees) ? h.attendees : [];
                    attendees.forEach(name => {
                        monthAttendanceCounts[name] = (monthAttendanceCounts[name] || 0) + 1;
                    });
                });

                regularMemberList.forEach(m => {
                    const val = currentFeeStatus[m.name];
                    const entry = typeof val === 'string' 
                        ? { status: val, reservedDiscount: false, singlePaid: false } 
                        : (val || { status: 'unpaid', reservedDiscount: false, singlePaid: false });
                    
                    const st = entry.status;
                    if (st === 'paid') {
                        paidCount++;
                        if (entry.reservedDiscount) {
                            reservedDiscountCount++;
                            collectedAmount += Math.max(0, monthlyFeeAmount - RESERVED_DISCOUNT_AMOUNT);
                        } else {
                            collectedAmount += monthlyFeeAmount;
                        }
                    } else if (st === 'single') {
                        singleCount++;
                        const attends = monthAttendanceCounts[m.name] || 0;
                        singleTotalAttendances += attends;
                        const singleTotal = attends * singleFeeAmount;
                        const finalDue = entry.reservedDiscount ? Math.max(0, singleTotal - RESERVED_DISCOUNT_AMOUNT) : singleTotal;
                        
                        if (entry.reservedDiscount) {
                            reservedDiscountCount++;
                        }
                        // 💡 0회 참석인 경우 낼 회비가 없으므로 자동으로 완납 대상이 됨, 1회 이상인 경우 실제 입금확인 체크 여부 반영
                        if (attends === 0 || entry.singlePaid) {
                            singlePaidCount++;
                            if (attends > 0) {
                                collectedAmount += finalDue;
                            }
                        }
                    } else if (st === 'break') {
                        breakCount++;
                    } else {
                        unpaidCount++;
                    }
                });

                // 납부 대상 인원 = 완료 + 일회비 + 미납 (부상은 유예)
                const totalTarget = paidCount + singleCount + unpaidCount;
                // 실제 완납율 = (정규완납 + 일회비완납) / 전체 대상
                const paidRate = totalTarget > 0 ? Math.round(((paidCount + singlePaidCount) / totalTarget) * 100) : 0;

                return { 
                    paidCount, 
                    reservedDiscountCount, 
                    singleCount, 
                    singlePaidCount,
                    singleTotalAttendances, 
                    breakCount, 
                    unpaidCount, 
                    paidRate, 
                    collectedAmount, 
                    totalTarget, 
                    monthAttendanceCounts 
                };
            }, [currentFeeStatus, regularMemberList, monthlyFeeAmount, singleFeeAmount, selectedMonth, attendanceHistory]);

            const copyUnpaidReminder = () => {
                const unpaidRegular = [];
                const unpaidSingle = [];

                regularMemberList.forEach(m => {
                    const val = currentFeeStatus[m.name];
                    const entry = typeof val === 'string' ? { status: val } : (val || { status: 'unpaid' });
                    const st = entry.status;
                    
                    if (st === 'unpaid') {
                        unpaidRegular.push(m.name);
                    } else if (st === 'single' && !entry.singlePaid) {
                        const attends = feeSummary.monthAttendanceCounts[m.name] || 0;
                        // 💡 0회 참석인 회원은 청구액이 0원이므로 미납 독촉 명단에서 당연히 제외!
                        if (attends > 0) {
                            const due = attends * singleFeeAmount - (entry.reservedDiscount ? RESERVED_DISCOUNT_AMOUNT : 0);
                            unpaidSingle.push(`${m.name}(일회비 ${Math.max(0, due).toLocaleString()}원)`);
                        }
                    }
                });

                const allUnpaid = [...unpaidRegular, ...unpaidSingle];

                if (allUnpaid.length === 0) {
                    notify("미납 대상 인원이 없습니다! 👏");
                    return;
                }

                let listText = '';
                if (unpaidRegular.length > 0) listText += `• 정규 회비 미납 (${unpaidRegular.length}명): ${unpaidRegular.join(', ')}\n`;
                if (unpaidSingle.length > 0) listText += `• 일회비 미입금 (${unpaidSingle.length}명): ${unpaidSingle.join(', ')}\n`;

                const msg = `📢 [맛드레 그라운드] ${selectedMonth.split('-')[1]}월 회비 납부 안내 ⚽\n\n` +
                    `정규 회비: 인당 ${monthlyFeeAmount.toLocaleString()}원 (구장예약 차감 시 ${(monthlyFeeAmount - RESERVED_DISCOUNT_AMOUNT).toLocaleString()}원)\n` +
                    `일회비: 정기전 회당 ${singleFeeAmount.toLocaleString()}원\n\n` +
                    listText +
                    `\n원활한 구장 대관 및 팀 운영을 위해 입금 확인 부탁드립니다. 감사합니다! 🔥`;

                const textArea = document.body.appendChild(document.createElement("textarea"));
                textArea.value = msg;
                textArea.select();
                try {
                    document.execCommand('copy');
                    notify("카톡 공지용 미납 안내문구가 복사되었습니다!");
                } catch (e) {}
                document.body.removeChild(textArea);
            };

            const handleShareText = () => {
                if (!matchedTeams) return;
                let text = `⚽ 오늘의 팀 매칭 결과 ⚽\n\n`;
                matchedTeams.forEach(team => {
                    text += `[${team.name}]\n`;
                    text += team.players.map(p => `- ${p.name}(${p.gender === '남' ? '남' : '여'})`).join('\n');
                    text += `\n\n`;
                });
                text += `오늘도 부상 없이 즐거운 경기 하세요! 🔥`;
                const textArea = document.body.appendChild(document.createElement("textarea"));
                textArea.value = text;
                textArea.select();
                try {
                    document.execCommand('copy');
                    notify("결과가 복사되었습니다!");
                } catch (err) {}
                document.body.removeChild(textArea);
            };

            const generateTeams = () => {
                if (!isAdmin && !isAdminRef.current) {
                    setPendingAdminAction(() => () => generateTeams());
                    setShowAdminModal(true);
                    return;
                }
                const attendees = members.filter(m => m.isAttending === true);
                if (attendees.length < teamCount * 5) {
                    notify(`인원이 부족합니다. ${teamCount}파전은 최소 ${teamCount * 5}명이 필요합니다.`);
                    return;
                }
                setIsMatching(true);
                setTimeout(() => {
                    const females = attendees.filter(p => p.gender === '여' || p.gender === 'F').sort((a, b) => b.level - a.level);
                    const males = attendees.filter(p => p.gender === '남' || p.gender === 'M').sort((a, b) => b.level - a.level);
                    
                    const getTeamAverage = (players) => {
                        if (players.length === 0) return 0;
                        const sum = players.reduce((acc, p) => acc + p.level, 0);
                        return sum / players.length;
                    };

                    const getCost = (teamsArray) => {
                        const avgs = teamsArray.map(t => getTeamAverage(t.players));
                        return Math.max(...avgs) - Math.min(...avgs);
                    };

                    let bestTeams = null;
                    let bestCost = Infinity;

                    for (let attempt = 0; attempt < 30; attempt++) {
                        let currentTeams = Array.from({ length: teamCount }, (_, i) => ({
                            id: i, name: `${String.fromCharCode(65 + i)}팀`, players: []
                        }));

                        const shuffledFemales = [...females].sort(() => Math.random() - 0.5);
                        const shuffledMales = [...males].sort(() => Math.random() - 0.5);

                        let teamIdx = 0;
                        shuffledFemales.forEach(p => { currentTeams[teamIdx].players.push(p); teamIdx = (teamIdx + 1) % teamCount; });
                        shuffledMales.forEach(p => { currentTeams[teamIdx].players.push(p); teamIdx = (teamIdx + 1) % teamCount; });

                        let currentCost = getCost(currentTeams);

                        for (let i = 0; i < 2000; i++) {
                            if (currentCost === 0) break;

                            const t1Idx = Math.floor(Math.random() * teamCount);
                            let t2Idx = Math.floor(Math.random() * teamCount);
                            while (t1Idx === t2Idx) {
                                t2Idx = Math.floor(Math.random() * teamCount);
                            }

                            const t1 = currentTeams[t1Idx];
                            const t2 = currentTeams[t2Idx];

                            if (t1.players.length === 0 || t2.players.length === 0) continue;

                            const p1Idx = Math.floor(Math.random() * t1.players.length);
                            const p1 = t1.players[p1Idx];

                            const matchingGenderPlayers = t2.players
                                .map((p, idx) => ({ p, idx }))
                                .filter(item => item.p.gender === p1.gender);

                            if (matchingGenderPlayers.length === 0) continue;

                            const p2Item = matchingGenderPlayers[Math.floor(Math.random() * matchingGenderPlayers.length)];
                            const p2Idx = p2Item.idx;
                            const p2 = p2Item.p;

                            t1.players[p1Idx] = p2;
                            t2.players[p2Idx] = p1;

                            const newCost = getCost(currentTeams);

                            if (newCost < currentCost) {
                                currentCost = newCost;
                            } else if (newCost === currentCost && Math.random() < 0.3) {
                            } else {
                                t1.players[p1Idx] = p1;
                                t2.players[p2Idx] = p2;
                            }
                        }

                        if (currentCost < bestCost) {
                            bestCost = currentCost;
                            bestTeams = currentTeams.map(t => ({ ...t, players: [...t.players] }));
                        }
                        if (bestCost === 0) break;
                    }

                    bestTeams.forEach(team => {
                        team.totalLevel = team.players.reduce((acc, p) => acc + p.level, 0);
                        team.fCount = team.players.filter(p => p.gender === '여' || p.gender === 'F').length;
                        team.mCount = team.players.filter(p => p.gender === '남' || p.gender === 'M').length;
                        for (let i = team.players.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [team.players[i], team.players[j]] = [team.players[j], team.players[i]];
                        }
                    });

                    setMatchedTeams(bestTeams.sort((a, b) => a.id - b.id));
                    setIsMatching(false);
                }, 600);
            };

            const sortedMembers = [...members].sort((a, b) => !a.isGuest ? a.name.localeCompare(b.name, 'ko-KR') : a.id - b.id);
            const filteredMembers = sortedMembers.filter(m => filterMode === 'unvoted' ? m.isAttending === null : filterMode === 'attending' ? m.isAttending === true : filterMode === 'hold' ? m.isAttending === "hold" : true);

            const attendingCount = members.filter(m => m.isAttending === true).length;
            const holdCount = members.filter(m => m.isAttending === "hold").length;
            const unvotedCount = members.filter(m => m.isAttending === null).length;

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [isLoading, activeTab, mainTab, members, matchedTeams, attendanceStats, rankPeriod, selectedMonth, customStartMonth, customEndMonth, isHistoryExpanded, excludeIrregular]);

            if (isLoading) {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-white p-10 text-center select-none">
                        <div className="relative mb-12 h-32 w-full flex items-center justify-center overflow-visible text-center">
                            <div className="animate-dribble-area flex items-center gap-6">
                                <div className="animate-piggy-run relative flex flex-col items-center">
                                    <svg width="76" height="76" viewBox="0 0 64 64">
                                        <circle cx="32" cy="38" r="21" fill="#FFC0CB" stroke="#FF69B4" strokeWidth="1.5" />
                                        <circle cx="32" cy="28" r="16" fill="#FFC0CB" stroke="#FF69B4" strokeWidth="1.5" />
                                        <path d="M19 18 Q16 6 26 15" fill="#FFC0CB" stroke="#FF69B4" strokeWidth="1.5" />
                                        <path d="M45 18 Q48 6 38 15" fill="#FFC0CB" stroke="#FF69B4" strokeWidth="1.5" />
                                        <ellipse cx="32" cy="32" rx="7" ry="5" fill="#FF69B4" />
                                        <circle cx="29" cy="32" r="1" fill="#C71585" />
                                        <circle cx="35" cy="32" r="1" fill="#C71585" />
                                        <circle cx="26" cy="25" r="1.8" fill="#333" />
                                        <circle cx="38" cy="25" r="1.8" fill="#333" />
                                    </svg>
                                    <div className="w-12 h-1.5 bg-gray-900/10 rounded-full mt-1 blur-[1px] animate-piggy-shadow"></div>
                                </div>
                                <div className="animate-ball-kick text-5xl leading-none">⚽</div>
                            </div>
                        </div>
                        <p className="text-sm text-gray-400 font-bold tracking-tight">맛드레 그라운드 입장 중...</p>
                        <p className="mt-4 text-xs text-green-600/90 font-black italic uppercase tracking-[0.2em]">made by 뚱서</p>
                    </div>
                );
            }

            return (
                <div className="h-[100dvh] w-full flex flex-col md:flex-row relative bg-gray-50 overflow-hidden text-center">
                    {showToast && (
                        <div className="fixed top-6 left-1/2 transform -translate-x-1/2 z-[300] bg-gray-900/95 backdrop-blur-md text-white px-5 py-2.5 rounded-full shadow-2xl font-bold animate-in fade-in slide-in-from-top-2 duration-300 text-xs text-center whitespace-nowrap border border-white/10">
                            {showToast}
                        </div>
                    )}

                        const recent6Months = [];
                        let curY = sYear;
                        let curM = sMonth;
                        for (let i = 0; i < 6; i++) {

                            curM -= 1;

                        let totalPaidAmount = 0;
                        let totalMatchesAttended = 0;

                            const val = feeRecords[mStr]?.[selectedFeeMember];
                            const entry = typeof val === 'string'
                                ? { status: val, reservedDiscount: false, singlePaid: false }

                            let isPaid = false;

                                isPaid = true;
                                completedCount += 1;
                                amount = entry.reservedDiscount ? Math.max(0, monthlyFeeAmount - RESERVED_DISCOUNT_AMOUNT) : monthlyFeeAmount;
                                totalPaidAmount += amount;
                                statusText = entry.reservedDiscount ? '완료 (예약할인)' : '완료';
                                statusColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                            } else if (entry.status === 'single') {
                                const rawFee = attends * singleFeeAmount;
                                const finalDue = entry.reservedDiscount ? Math.max(0, rawFee - RESERVED_DISCOUNT_AMOUNT) : rawFee;
                                if (entry.singlePaid) {
                                    isPaid = true;
                                    completedCount += 1;
                                    amount = finalDue;
                                    totalPaidAmount += amount;
                                    statusText = entry.reservedDiscount ? '일회비 완납(예약)' : '일회비 완납';
                                    statusColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';

                                    amount = finalDue;
                                    statusText = `일회비 미입금 (${finalDue.toLocaleString()}원)`;
                                    statusColor = 'bg-amber-50 text-amber-700 border-amber-200';

                            } else if (entry.status === 'break') {
                                statusText = '부상 (유예)';
                                statusColor = 'bg-slate-100 text-slate-600 border-slate-200';
                            } else {
                                statusText = '미납';
                                statusColor = 'bg-rose-50 text-rose-600 border-rose-200';
                            }

                            return {
                                month: mStr,
                                attends,
                                statusText,
                                statusColor,
                                amount,
                                isPaid,
                                rawStatus: entry.status,
                                hasDiscount: !!entry.reservedDiscount

                                                    recordForm.matchType === '비정기'
                                                        ? 'bg-purple-600 text-white border-purple-600 shadow-sm'
                                                        : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'
                                                }`}
                                            >
                                                <span>⚡</span> 비정기 매치
                                            </button>
                                        </div>
                                    </div>

                                    {recordForm.matchType === '비정기' && (

                                                <span className="text-[9px] text-gray-400">교류전, 번개 등</span>
                                            </div>
                                            <input 
                                                type="text" 
                                                value={recordForm.eventNote} 
                                                onChange={e => setRecordForm({...recordForm, eventNote: e.target.value})} 
                                                className="w-full border border-purple-200 bg-purple-50/30 p-2.5 rounded-xl font-bold text-xs outline-none focus:border-purple-500 shadow-sm"
                                                placeholder="예: 타팀 교류전, 주중 야간 번개 매치"

                                    <div>
                                        <div className="flex justify-between items-center mb-1">

                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[150] p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl animate-in zoom-in-95 duration-200 border border-gray-100">
                                <div className="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Icon name="RotateCcw" className="w-6 h-6" />
                                </div>
                                <h3 className="text-base font-black mb-1 break-keep">모든 투표 초기화</h3>
                                <p className="text-[11px] text-gray-500 mb-6 break-keep leading-relaxed font-bold">현재 등록된 모든 멤버의 투표 상태를<br/><span className="text-red-500 font-black">"미투표"</span> 상태로 되돌리시겠습니까?</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowResetModal(false)} className="flex-1 py-3.5 bg-gray-50 rounded-xl font-bold text-xs text-gray-400 active:scale-95 transition-all">취소</button>
                                    <button onClick={executeReset} className="flex-1 py-3.5 bg-red-500 text-white rounded-xl font-bold text-xs shadow-md active:scale-95 transition-all">네, 초기화합니다</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 참석 상태 변경 확인 모달 */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[110] p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl p-8 max-w-xs w-full shadow-2xl animate-in zoom-in-95 duration-200 border border-gray-100">
                                <div className={`w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-5 ${showConfirmModal.nextStatus === true ? 'bg-green-50 text-green-600' : showConfirmModal.nextStatus === "hold" ? 'bg-amber-50 text-amber-600' : 'bg-red-50 text-red-500'} shadow-sm`}>
                                    <Icon name={showConfirmModal.nextStatus === true ? "UserCheck" : showConfirmModal.nextStatus === "hold" ? "Clock" : "UserX"} className="w-7 h-7" />
                                </div>
                                <h3 className="text-lg font-black mb-2 text-gray-800 tracking-tight">본인 확인</h3>
                                <p className="text-[11px] text-gray-500 mb-8 break-keep leading-relaxed">
                                    <span className="text-gray-900 font-black">[{showConfirmModal.name}]</span>님의 참석 상태를<br/>
                                    <span className={`font-black ${showConfirmModal.nextStatus === true ? 'text-green-600' : showConfirmModal.nextStatus === "hold" ? 'text-amber-600' : 'text-red-500'}`}>
                                        {showConfirmModal.nextStatus === true ? '"참석"' : showConfirmModal.nextStatus === "hold" ? '"보류"' : '"불참"'}
                                    </span>으로 변경하시겠습니까?
                                </p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirmModal(null)} className="flex-1 py-4 bg-gray-100 rounded-2xl font-bold text-xs text-gray-400 active:scale-95 transition-all tracking-tight">아니요</button>
                                    <button onClick={executeAttendanceChange} className={`flex-1 py-4 text-white rounded-2xl font-bold text-xs shadow-lg active:scale-95 transition-all tracking-tight ${showConfirmModal.nextStatus === true ? 'bg-green-600' : showConfirmModal.nextStatus === "hold" ? 'bg-amber-600' : 'bg-red-500'}`}>네, 맞습니다</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 관리자 암호 모달 */}
                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-[2rem] p-8 max-w-xs w-full shadow-2xl animate-in zoom-in-95 duration-200 border border-gray-100">
                                <Icon name="Lock" className="text-green-600 mb-4 w-10 h-10 mx-auto" />
                                <h3 className="text-lg font-black mb-2 text-gray-800 tracking-tight">관리자 인증</h3>
                                <p className="text-xs text-gray-400 mb-6 uppercase tracking-widest font-medium">암호를 입력해 주세요</p>
                                
                                <form onSubmit={(e) => { e.preventDefault(); handleAdminLogin(); }}>
                                    <input 
                                        type="password" 
                                        value={passwordInput} 
                                        onChange={e => { setPasswordInput(e.target.value); setPasswordError(false); }} 
                                        className={`w-full border-2 p-3.5 rounded-2xl mb-2 text-center text-xl outline-none font-black transition-all ${passwordError ? 'border-red-400 bg-red-50' : 'border-gray-50 focus:border-green-400 focus:bg-white'}`} 
                                        placeholder="••••" 
                                        autoFocus 
                                    />
                                    <div className="h-5">{passwordError && <p className="text-red-500 text-[10px] font-bold animate-bounce">비밀번호가 일치하지 않습니다.</p>}</div>
                                    <div className="flex gap-3 mt-4">
                                        <button 
                                            type="button" 
                                            onClick={() => { setShowAdminModal(false); setPasswordInput(''); setPasswordError(false); setPendingAdminAction(null); }} 
                                            className="flex-1 py-4 bg-gray-100 rounded-2xl font-bold text-xs text-gray-400 active:scale-95 transition-all tracking-tight"
                                        >
                                            취소
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 py-4 bg-green-600 text-white rounded-2xl font-bold text-xs shadow-lg active:scale-95 transition-all tracking-tight"
                                        >
                                            확인
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 멤버 삭제 모달 */}
                    {showDeleteModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[200] p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl animate-in zoom-in-95 duration-200 border border-gray-100">
                                <Icon name="Trash2" className="w-10 h-10 text-red-500 mb-4 mx-auto" />
                                <h3 className="text-sm font-black mb-1">멤버 삭제</h3>
                                <p className="text-gray-400 font-bold text-[10px] mb-6 leading-tight break-keep"><span className="text-red-500 font-black">{showDeleteModal.name}</span>님을 DB에서 삭제할까요?</p>
                                <div className="flex gap-2 font-black text-xs">
                                    <button onClick={() => setShowDeleteModal(null)} className="flex-1 py-2.5 bg-gray-50 rounded-xl text-gray-400">취소</button>
                                    <button onClick={() => { 
                                        const member = showDeleteModal; 
                                        setMembers(prev => prev.filter(m => m.id !== member.id)); 
                                        if (SHEET_API_URL) {
                                            fetch(SHEET_API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', name: member.name }) }).catch(() => {});
                                        }
                                        setShowDeleteModal(null); 
                                        notify(`${member.name}님 삭제 완료`); 
                                    }} className="flex-1 py-2.5 bg-red-500 text-white rounded-xl shadow-md">삭제</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 용병 추가 모달 */}
                    {showGuestModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-[2.5rem] p-8 max-w-xs w-full shadow-2xl animate-in zoom-in-95 duration-200 border border-gray-100">
                                <h3 className="text-base font-black mb-5 text-gray-800 uppercase tracking-tight">용병 추가 🏃‍♂️</h3>
                                <div className="space-y-4">
                                    <input 
                                        type="text" 
                                        value={guestInput.name} 
                                        onChange={e => setGuestInput({...guestInput, name: e.target.value})} 
                                        className="w-full border border-gray-100 p-2.5 rounded-lg outline-none focus:border-green-400 font-black text-xs bg-gray-50 shadow-inner" 
                                        placeholder="이름 또는 별명" 
                                        autoFocus 
                                    />
                                    <div className="flex gap-2">
                                        <div className="flex gap-1 bg-white border border-gray-100 p-1 rounded-lg flex-1 shadow-sm">
                                            <button onClick={() => setGuestInput({...guestInput, gender: '남'})} className={`flex-1 py-1.5 rounded-md font-black text-[9px] transition-all ${guestInput.gender === '남' ? 'bg-blue-50 text-blue-500' : 'bg-transparent text-blue-300'}`}>남</button>
                                            <button onClick={() => setGuestInput({...guestInput, gender: '여'})} className={`flex-1 py-1.5 rounded-md font-black text-[9px] transition-all ${guestInput.gender === '여' ? 'bg-orange-500 text-white shadow-md' : 'text-orange-300'}`}>여</button>
                                        </div>
                                        <select value={guestInput.level} onChange={e => setGuestInput({...guestInput, level: Number(e.target.value)})} className="flex-1 border border-gray-100 p-2.5 rounded-lg outline-none focus:border-green-400 bg-white font-black text-xs shadow-sm cursor-pointer">
                                            {[1,2,3,4,5].map(v => <option key={v} value={v}>Lv.{v}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="flex gap-2 mt-8 font-black text-[11px]">
                                    <button onClick={() => { setShowGuestModal(false); setGuestInput({name:'', gender:'남', level:3}); }} className="flex-1 py-2.5 bg-gray-50 rounded-xl text-gray-400 uppercase tracking-tighter">취소</button>
                                    <button onClick={() => { 
                                        if (!guestInput.name.trim()) return; 
                                        setMembers([...members, { ...guestInput, id: Date.now(), isGuest: true, isAttending: true }]); 
                                        setGuestInput({ name: '', gender: '남', level: 3 }); 
                                        setShowGuestModal(false); 
                                        notify("용병이 추가되었습니다."); 
                                    }} className="flex-1 py-2.5 bg-green-600 text-white rounded-xl shadow-md uppercase tracking-tighter">추가하기</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
